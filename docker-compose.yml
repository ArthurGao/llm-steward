# Profiles (design §3):
#   native    llm-steward alone, SQLite on a volume, native providers.     docker compose --profile native up
#   standard  llm-steward + WeKnora; governance DB in PostgreSQL + pgvector: add `--profile db` for the
#             bundled one (steward-db), or set STEWARD_STANDARD_DATABASE_URL to your own.
#   docparse  llm-steward + RAGFlow (complex documents); RAGFlow is its own stack:
#             deploy/ragflow/README.md, then  docker compose --profile docparse up
# Copy .env.example to .env first (engine secrets and keys, and the governance DB URL).
name: llm-steward

include:
  - path: deploy/weknora/compose.yml
    env_file: .env

x-steward: &steward
  build: ./backend
  image: llm-steward:dev
  ports:
    - "127.0.0.1:8600:8600"
  restart: unless-stopped

# llm-steward on the shared PG with its memory engine (`standard`, `docparse`): lite-mem in-process by
# default (schema lite_mem), or mem0 (schema mem0); only the KB engine differs.
x-steward-pg: &steward-pg
  <<: *steward
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - steward-state:/data  # mem0's history database, when mem0 is the engine (the embedding model is in the image)

x-steward-pg-env: &steward-pg-env
  # Unset: the bundled steward-db (`--profile db`). Without a reachable database /health says so.
  STEWARD_DATABASE_URL: ${STEWARD_STANDARD_DATABASE_URL:-postgresql+asyncpg://steward:${STEWARD_DB_PASSWORD:-}@steward-db:5432/steward}
  # The memory engine: litemem (default; extracts and resolves conflicts itself), mem0 (extracts;
  # llm-steward compensates conflicts through the LLM role layer, which then must be set or the
  # service refuses to start), or native with STEWARD_MEMORY_LLM=true (llm-steward extracts).
  # llm-gateway is loopback-only by design, so a container needs a vendor endpoint or the host's Ollama.
  STEWARD_MEMORY_PROVIDER: ${STEWARD_MEMORY_PROVIDER:-litemem}
  STEWARD_MEMORY_LLM: ${STEWARD_MEMORY_LLM:-false}
  STEWARD_LLM_BASE_URL: ${STEWARD_LLM_BASE_URL:-}
  STEWARD_LLM_API_KEY: ${STEWARD_LLM_API_KEY:-}
  STEWARD_LLM_MODEL: ${STEWARD_LLM_MODEL:-}
  # lite-mem in-process: the same database (schema lite_mem, migrated at start); its models are
  # the LLM endpoint above (else qwen3:8b on the host's Ollama) and bge-m3:567m embeddings on the
  # host's Ollama, the model WeKnora uses.
  # Or a lite-mem service of its own: STEWARD_LITEMEM_MODE=http, _URL and _API_KEY.
  STEWARD_LITEMEM_MODE: ${STEWARD_LITEMEM_MODE:-inprocess}
  STEWARD_LITEMEM_URL: ${STEWARD_LITEMEM_URL:-http://host.docker.internal:8710}
  STEWARD_LITEMEM_API_KEY: ${STEWARD_LITEMEM_API_KEY:-}
  LITEMEM_EMBEDDING__BASE_URL: ${LITEMEM_EMBEDDING_URL:-http://host.docker.internal:11434}
  LITEMEM_LLM__BASE_URL: ${STEWARD_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
  LITEMEM_LLM__API_KEY: ${STEWARD_LLM_API_KEY:-}
  LITEMEM_LLM__MODEL: ${STEWARD_LLM_MODEL:-qwen3:8b}

services:
  # The governance DB for `standard` / `docparse` when you have no PostgreSQL + pgvector of your own.
  # lite-mem and mem0 create the `vector` extension on first use (this role owns the database).
  steward-db:
    image: pgvector/pgvector:0.8.1-pg17
    profiles: [db]
    environment:
      POSTGRES_USER: steward
      POSTGRES_PASSWORD: ${STEWARD_DB_PASSWORD:-}  # the image refuses an empty one
      POSTGRES_DB: steward
    volumes:
      - steward-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steward -d steward"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  steward-native:
    <<: *steward
    profiles: [native]
    environment:
      STEWARD_DATABASE_URL: sqlite+aiosqlite:////data/steward.db
      STEWARD_MEMORY_PROVIDER: native
      STEWARD_KB_PROVIDER: native
      # The SQLite database; the local embedding model is baked into the image.
    volumes:
      - steward-data:/data

  steward-standard:
    <<: *steward-pg
    profiles: [standard]
    environment:
      <<: *steward-pg-env
      STEWARD_KB_PROVIDER: weknora
      STEWARD_WEKNORA_URL: http://weknora-app:8080
      STEWARD_WEKNORA_API_KEY: ${STEWARD_WEKNORA_API_KEY:-}  # deploy/weknora/bootstrap.py
      STEWARD_WEKNORA_EMBEDDING_MODEL_ID: ${STEWARD_WEKNORA_EMBEDDING_MODEL_ID:-}
    depends_on:
      weknora-app:
        condition: service_healthy
      steward-db:
        condition: service_healthy
        required: false  # only with `--profile db`

  steward-docparse:
    <<: *steward-pg
    profiles: [docparse]
    environment:
      <<: *steward-pg-env
      STEWARD_KB_PROVIDER: ragflow
      # RAGFlow runs as its own compose project, published on the host's 127.0.0.1:8690
      STEWARD_RAGFLOW_URL: http://host.docker.internal:8690
      STEWARD_RAGFLOW_API_KEY: ${STEWARD_RAGFLOW_API_KEY:-}  # deploy/ragflow/bootstrap.py
    depends_on:
      steward-db:
        condition: service_healthy
        required: false  # only with `--profile db`

volumes:
  steward-data:
  steward-state:
  steward-pg:
