# Profiles (design §3):
#   native    llm-steward alone, SQLite on a volume, native providers.     docker compose --profile native up
#   standard  llm-steward + WeKnora; governance DB is the shared local PG.  docker compose --profile standard up
#   docparse  RAGFlow instead of WeKnora — arrives in P7.
# Copy .env.example to .env first (secrets for WeKnora and the standard DB URL).
name: llm-steward

include:
  - path: deploy/weknora/compose.yml
    env_file: .env

x-steward: &steward
  build: ./backend
  image: llm-steward:dev
  ports:
    - "127.0.0.1:8600:8600"
  restart: unless-stopped

services:
  steward-native:
    <<: *steward
    profiles: [native]
    environment:
      STEWARD_DATABASE_URL: sqlite+aiosqlite:////data/steward.db
      STEWARD_MEMORY_PROVIDER: native
      STEWARD_KB_PROVIDER: native
      # The image keeps the local embedding model (~220 MB, downloaded on first use) on this volume.
    volumes:
      - steward-data:/data

  steward-standard:
    <<: *steward
    profiles: [standard]
    environment:
      # Without a password in .env the database check fails loudly in /health.
      STEWARD_DATABASE_URL: ${STEWARD_STANDARD_DATABASE_URL:-postgresql+asyncpg://llm_steward@host.docker.internal:5432/llm_steward}
      STEWARD_MEMORY_PROVIDER: mem0
      STEWARD_KB_PROVIDER: weknora
      STEWARD_WEKNORA_URL: http://weknora-app:8080
      # mem0 extracts through the LLM role layer; without these the service refuses to start.
      # llm-gateway is loopback-only by design, so a container needs a vendor endpoint here.
      STEWARD_LLM_BASE_URL: ${STEWARD_LLM_BASE_URL:-}
      STEWARD_LLM_API_KEY: ${STEWARD_LLM_API_KEY:-}
      STEWARD_LLM_MODEL: ${STEWARD_LLM_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      weknora-app:
        condition: service_healthy

volumes:
  steward-data:
