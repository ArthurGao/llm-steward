[project]
name = "llm-steward"
version = "0.1.0"
description = "Governance layer for AI memory and knowledge"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "httpx2>=2.16",
    "typer>=0.15",
    "jinja2>=3.1",
    "openai>=1.60",
]

[project.optional-dependencies]
# Built-in native provider (design §3): vector search, FTS segmentation, local embeddings.
native = [
    "sqlite-vec>=0.1.9",
    "fastembed>=0.9.1",
    "jieba>=0.42.1",
]
# Default memory engine (design §2): mem0 in-process on PostgreSQL/pgvector, local MiniLM embeddings.
# Pinned exactly: upgrading mem0 requires the contract tests (`pytest -m contract`) to pass first.
mem0 = [
    "mem0ai==2.2.1",
    "psycopg[binary,pool]>=3.2",
    "fastembed>=0.9.1",
]
# Optional rerank (design §6 step 5): a local fastembed cross-encoder (STEWARD_RERANK_MODEL).
rerank = [
    "fastembed>=0.9.1",
]
# The owner's own RAG engine in-process (`STEWARD_LITERAG_MODE=inprocess`); the default HTTP mode needs
# nothing. Pinned to a commit: upgrading requires the contract tests (`pytest -m contract`) to pass first.
literag = [
    "lite-rag[server] @ git+https://github.com/ArthurGao/lite-rag@6d52f90c161c53ee49f24e61517b906ba52ce0d1",
]

[project.scripts]
steward = "llm_steward.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "llm-steward[literag]",  # the default suite imports lite-rag; one pin, in the extra
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]
# Full-width punctuation is intentional: Chinese prompt context and sentence splitting.
allowed-confusables = ["：", "（", "）", "！", "？"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["llm_steward"]
mypy_path = "src"

[[tool.mypy.overrides]]
# No type information shipped by these (native / mem0 extras).
module = ["sqlite_vec", "jieba", "mem0", "mem0.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Opt-in, deselected by default: `-m model` (real local embedding model, ~220 MB once) and
# `-m contract` (adapters against real engines, e.g. mem0 on the local PostgreSQL).
addopts = "-m 'not model and not contract and not eval'"
markers = [
    "model: runs the real fastembed model (opt-in: uv run pytest -m model)",
    "eval: retrieval quality on the labelled set, real local embedding (opt-in: uv run pytest -m eval)",
    "contract: adapter contract against a real external engine (opt-in: uv run pytest -m contract)",
]

[tool.importlinter]
root_package = "llm_steward"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api/mcp -> services -> providers/pipeline/storage"
type = "layers"
layers = [
    "llm_steward.api | llm_steward.mcp",
    "llm_steward.services",
    "llm_steward.providers | llm_steward.pipeline",
    "llm_steward.llm",
    "llm_steward.models",
    "llm_steward.storage",
]

[[tool.importlinter.contracts]]
name = "Services, providers, pipeline and storage do not depend on the web framework"
type = "forbidden"
source_modules = [
    "llm_steward.services",
    "llm_steward.providers",
    "llm_steward.pipeline",
    "llm_steward.llm",
    "llm_steward.models",
    "llm_steward.storage",
]
forbidden_modules = ["fastapi", "starlette"]
