[project]
name = "llm-steward"
version = "0.1.0"
description = "Governance layer for AI memory and knowledge"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "httpx2>=2.16",
    "typer>=0.15",
    "jinja2>=3.1",
    "lite-model",  # every LLM call (its design §12); the OpenAI SDK comes with it
    "pyyaml>=6.0",
    "pyjwt>=2.10",
    "mcp==2.3.0",
]

[project.optional-dependencies]
# Built-in native provider (design §3): vector search, FTS segmentation, local embeddings.
native = [
    "sqlite-vec>=0.1.9",
    "fastembed>=0.9.1",
    "jieba>=0.42.1",
]
# Default memory engine (design §2): mem0 in-process on PostgreSQL/pgvector, local MiniLM embeddings.
# Pinned exactly: upgrading mem0 requires the contract tests (`pytest -m contract`) to pass first.
mem0 = [
    "mem0ai==2.2.1",
    "psycopg[binary,pool]>=3.2",
    "fastembed>=0.9.1",
]
# Optional rerank (design §6 step 5): a local fastembed cross-encoder (STEWARD_RERANK_MODEL).
rerank = [
    "fastembed>=0.9.1",
]
# The owner's own RAG engine in-process (`STEWARD_LITERAG_MODE=inprocess`); the default HTTP mode needs
# nothing. Pinned to a commit: upgrading requires the contract tests (`pytest -m contract`) to pass first.
literag = [
    "lite-rag[server] @ git+https://github.com/ArthurGao/lite-rag@a1dd603a0355718ee045606bbfe40ed38c978a36",
]
# The owner's own memory engine in-process (`STEWARD_MEMORY_PROVIDER=litemem`,
# `STEWARD_LITEMEM_MODE=inprocess`); the default HTTP mode needs nothing. Pinned to a commit:
# upgrading requires the contract tests (`pytest -m contract`) to pass first.
litemem = [
    "lite-mem[server,sqlite] @ git+https://github.com/ArthurGao/lite-mem@95d89e74309820c8a188704980d4e41539c64d50",
]
# The LLM response cache (design §11 P10, `STEWARD_CACHE__ENABLED`, off by default): lite-cache's
# exact (L1) cache as an AsyncCacheHook on PostgreSQL. A release wheel; it names its lite-model.
cache = [
    "lite-cache",
]
# The reconcile triage assistant (design §11 P11, `STEWARD_AGENT__RECONCILE_TRIAGE`, off by default):
# a lite-agent tool loop, sessions in lite-agent's PostgreSQL store. A release wheel.
agent = [
    "lite-agent[pg]",
]

[project.scripts]
steward = "llm_steward.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "llm-steward[literag]",  # the default suite imports lite-rag; one pin, in the extra
    "llm-steward[litemem]",  # and lite-mem (its contract tests and in-process transport)
    "llm-steward[cache]",  # the cache hook's tests (P10)
    "llm-steward[agent]",  # the triage agent's tests (P11)
    "types-pyyaml>=6.0",
    "llm-steward-client",
    # The recall gate (`pytest -m eval`) runs on lite-eval (design §11 P8), a release wheel (it
    # carries the Viewer): an upgrade re-runs tests/eval/test_recall_equivalence.py, which compares
    # it with the frozen original.
    "lite-eval @ https://github.com/ArthurGao/lite-eval/releases/download/v0.4.1/lite_eval-0.4.1-py3-none-any.whl",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]
# Full-width punctuation is intentional: Chinese prompt context and sentence splitting.
allowed-confusables = ["：", "（", "）", "！", "？", "，"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["llm_steward"]
mypy_path = "src"

[[tool.mypy.overrides]]
# No type information shipped by these (native / mem0 extras).
module = ["sqlite_vec", "jieba", "mem0", "mem0.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Opt-in, deselected by default: `-m model` (real local embedding model, ~220 MB once) and
# `-m contract` (adapters against real engines, e.g. mem0 on the local PostgreSQL).
addopts = "-m 'not model and not contract and not eval and not triage'"
markers = [
    "model: runs the real fastembed model (opt-in: uv run pytest -m model)",
    "eval: retrieval quality on the labelled set, real local embedding (opt-in: uv run pytest -m eval)",
    "contract: adapter contract against a real external engine (opt-in: uv run pytest -m contract)",
    "triage: the reconcile triage assistant on the local Ollama (opt-in: uv run pytest -m triage -s)",
]

[tool.importlinter]
root_package = "llm_steward"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api/mcp -> services -> providers/pipeline/storage"
type = "layers"
layers = [
    "llm_steward.api | llm_steward.mcp",
    "llm_steward.services",
    "llm_steward.providers | llm_steward.pipeline",
    "llm_steward.llm",
    "llm_steward.models",
    "llm_steward.storage",
]

[[tool.importlinter.contracts]]
name = "Services, providers, pipeline and storage do not depend on the web framework"
type = "forbidden"
source_modules = [
    "llm_steward.services",
    "llm_steward.providers",
    "llm_steward.pipeline",
    "llm_steward.llm",
    "llm_steward.models",
    "llm_steward.storage",
]
forbidden_modules = ["fastapi", "starlette"]

[tool.uv.sources]
lite-model = { url = "https://github.com/ArthurGao/lite-model/releases/download/v0.8.0/lite_model-0.8.0-py3-none-any.whl" }
lite-cache = { url = "https://github.com/ArthurGao/lite-cache/releases/download/v0.3.3/lite_cache-0.3.3-py3-none-any.whl" }
lite-agent = { url = "https://github.com/ArthurGao/lite-agent/releases/download/v0.3.0/lite_agent-0.3.0-py3-none-any.whl" }
llm-steward-client = { path = "../sdk/python", editable = true }
