# Install the git hook once, from the repo root: uv run --project backend pre-commit install
# All hooks run the project's own pinned tools through uv, so results match CI.
files: ^backend/
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check
        entry: uv run --directory backend ruff format --check
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy
        language: system
        pass_filenames: false
      - id: lint-imports
        name: import-linter
        entry: uv run --directory backend lint-imports
        language: system
        pass_filenames: false
