name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # conftest runs every DB test on SQLite and on this PostgreSQL in the same pytest run;
    # PG cases use schema steward_test and fail (never skip) if STEWARD_TEST_DATABASE_URL is missing.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: llm_steward
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: llm_steward
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llm_steward -d llm_steward"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STEWARD_TEST_DATABASE_URL: postgresql+asyncpg://llm_steward:ci@localhost:5432/llm_steward
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3   # setup-uv has no moving v10 tag
        with:
          version: "0.10.8"
      - run: uv sync --locked --all-extras   # Python from backend/.python-version
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest -v   # `-m model` / `-m contract` (real model, real engines) stay local

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.10.8"
      - run: uv sync --locked --all-extras   # `embedded` installs the backend from ../../backend
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -v   # includes the spec/models drift check (scripts/generate.py --check)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm -C apps/admin exec playwright install --with-deps chromium   # fast when the cache hit
      - run: pnpm e2e   # Playwright against the production build in mock mode
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.10.8"
      - run: uv sync --locked --extra native   # the real backend for the live flows (native engines, fake LLM)
        working-directory: backend
      - run: pnpm e2e:live   # the P6 acceptance flows: the live Admin against that backend
